---
- name: Ensure destination directory exists
  ansible.builtin.file:
    path: "{{ openvpn_easyrsa_dest }}"
    state: directory
    mode: '0750'

- name: Check if easy rsa version directory exists
  ansible.builtin.stat:
    path: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}"
  register: openvpn_easyrsa_dir

- name: Download easy-rsa release
  ansible.builtin.get_url:
    url: "{{ openvpn_easyrsa_url }}"
    dest: "/tmp/EasyRSA-{{ openvpn_easyrsa_version }}.tgz"
    mode: '0644'
  when: not openvpn_easyrsa_dir.stat.exists

- name: Extract easy-rsa archive
  ansible.builtin.unarchive:
    src: "/tmp/EasyRSA-{{ openvpn_easyrsa_version }}.tgz"
    dest: "{{ openvpn_easyrsa_dest }}"
    remote_src: true
    creates: "{{ openvpn_easyrsa_dest }}/EasyRSA-\
              {{ openvpn_easyrsa_version }}"
  when: not ansible_check_mode

- name: Check if EasyRSA vars exists
  ansible.builtin.stat:
    path: "{{ openvpn_easyrsa_dest }}/EasyRSA-\
           {{ openvpn_easyrsa_version }}/vars"
  register: openvpn_easy_var_file

- name: Check if EasyRSA vars.example exists
  ansible.builtin.stat:
    path: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}/\
           vars.example"
  register: openvpn_easy_var_example_file

- name: Copy vars.example to vars in EasyRSA directory
  ansible.builtin.copy:
    src: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}/\
            vars.example"
    dest: "/opt/easy-rsa/EasyRSA-{{ openvpn_easyrsa_version }}/vars"
    remote_src: true
    mode: '0644'
  when:
    - not openvpn_easy_var_file.stat.exists
    - openvpn_easy_var_example_file.stat.exists

- name: Set EASYRSA_REQ_COUNTRY
  ansible.builtin.lineinfile:
    path: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}/\
           vars"
    regexp: '^#set_var EASYRSA_REQ_COUNTRY'
    line: 'set_var EASYRSA_REQ_COUNTRY    "{{ openvpn_easyrsa_country }}"'
  when:
    - openvpn_easy_var_file.stat.exists

- name: Set EASYRSA_REQ_PROVINCE
  ansible.builtin.lineinfile:
    path: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ easy_rsa_version }}/vars"
    regexp: '^#set_var EASYRSA_REQ_PROVINCE'
    line: 'set_var EASYRSA_REQ_PROVINCE   "{{ openvpn_easyrsa_province }}"'
  when:
    - openvpn_easy_var_file.stat.exists

- name: Set EASYRSA_REQ_CITY
  ansible.builtin.lineinfile:
    path: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}/\
           vars"
    regexp: '^#set_var EASYRSA_REQ_CITY'
    line: 'set_var EASYRSA_REQ_CITY       "{{ openvpn_easyrsa_city }}"'
  when:
    - openvpn_easy_var_file.stat.exists

- name: Set EASYRSA_REQ_ORG
  ansible.builtin.lineinfile:
    path: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}/\
           vars"
    regexp: '^#set_var EASYRSA_REQ_ORG'
    line: 'set_var EASYRSA_REQ_ORG        "{{ openvpn_easyrsa_org }}"'
  when:
    - openvpn_easy_var_file.stat.exists

- name: Set EASYRSA_REQ_EMAIL
  ansible.builtin.lineinfile:
    path: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}/\
           vars"
    regexp: '^#set_var EASYRSA_REQ_EMAIL'
    line: 'set_var EASYRSA_REQ_EMAIL      "{{ openvpn_easyrsa_email }}"'
  when:
    - openvpn_easy_var_file.stat.exists

- name: Set EASYRSA_REQ_OU
  ansible.builtin.lineinfile:
    path: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}/\
            vars"
    regexp: '^#set_var EASYRSA_REQ_OU'
    line: 'set_var EASYRSA_REQ_OU         "{{ openvpn_easyrsa_ou }}"'
  when:
    - openvpn_easy_var_file.stat.exists

- name: Check PKI directory
  ansible.builtin.stat:
    path: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}/\
            pki"
  register: openvpn_pki_dir

- name: Initialize PKI directory
  ansible.builtin.command: "./easyrsa init-pki"
  args:
    chdir: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}"
    creates: "{{ openvpn_easyrsa_dest }}/EasyRSA-\
              {{ openvpn_easyrsa_version }}/pki"
  when:
    - not openvpn_pki_dir.stat.exists
    - not ansible_check_mode

- name: Build CA without password
  ansible.builtin.command:
    argv:
      - ./easyrsa
      - --batch
      - --req-cn={{ openvpn_easyrsa_common_name }}
      - build-ca
      - nopass
  args:
    chdir: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}"
    creates: "{{ openvpn_easyrsa_dest }}/EasyRSA-\
              {{ openvpn_easyrsa_version }}/pki/ca.crt"
  when:
    - not openvpn_pki_dir.stat.exists
    - not ansible_check_mode

- name: Build server certificate without password
  ansible.builtin.command:
    argv:
      - ./easyrsa
      - --batch
      - gen-req
      - "{{ openvpn_easyrsa_server_name }}"
      - nopass
  args:
    chdir: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}"
    creates: "{{ openvpn_easyrsa_dest }}/EasyRSA-\
              {{ openvpn_easyrsa_version }}/\
              pki/reqs/{{ openvpn_easyrsa_server_name }}.req"
  when:
    - openvpn_pki_dir.stat.exists
    - not ansible_check_mode

- name: Copy key file to /etc/openvpn
  ansible.builtin.copy:
    src: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}/\
           pki/private/{{ openvpn_easyrsa_server_name }}.key"
    dest: "/etc/openvpn"
    remote_src: true
    mode: '0644'

- name: Sign server certificate
  ansible.builtin.command:
    argv:
      - ./easyrsa
      - --batch
      - sign-req
      - server
      - "{{ openvpn_easyrsa_server_name }}"
  args:
    chdir: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}"
    creates: "{{ openvpn_easyrsa_dest }}/EasyRSA-\
              {{ openvpn_easyrsa_version }}/\
              pki/issued/{{ openvpn_easyrsa_server_name }}.crt"
  when:
    - not ansible_check_mode

- name: Copy server crt file to /etc/openvpn
  ansible.builtin.copy:
    src: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}/\
           pki/issued/{{ openvpn_easyrsa_server_name }}.crt"
    dest: "/etc/openvpn"
    remote_src: true
    mode: '0644'

- name: Copy ca.crt file to /etc/openvpn
  ansible.builtin.copy:
    src: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}/\
           pki/ca.crt"
    dest: "/etc/openvpn"
    remote_src: true
    mode: '0644'

- name: Check if dh.pem file exists
  ansible.builtin.stat:
    path: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}/\
            pki/dh.pem"
  register: openvpn_easyrsa_dh_pem_source_file

- name: Generate Diffie-Hellman parameters
  ansible.builtin.command: "./easyrsa gen-dh"
  args:
    chdir: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}"
    creates: "{{ openvpn_easyrsa_dest }}/EasyRSA-\
              {{ openvpn_easyrsa_version }}/pki/dh.pem"
  when:
    - not openvpn_easyrsa_dh_pem_source_file.stat.exists

- name: Copy dh.pem file to /etc/openvpn
  ansible.builtin.copy:
    src: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}/\
           pki/dh.pem"
    dest: "/etc/openvpn"
    remote_src: true
    mode: '0644'

- name: Check if ta.key source file exists
  ansible.builtin.stat:
    path: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}/\
            ta.key"
  register: openvpn_easyrsa_ta_key_source_file
  when: openvpn_ta_enabled

- name: Generate ta.key file
  ansible.builtin.command:
    argv:
      - openvpn
      - --genkey
      - --secret
      - ta.key
  args:
    chdir: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}"
    creates: "{{ openvpn_easyrsa_dest }}/EasyRSA-\
              {{ openvpn_easyrsa_version }}/ta.key"
  when:
    - not openvpn_easyrsa_ta_key_source_file.stat.exists
    - openvpn_ta_enabled

- name: Copy ta.key file to /etc/openvpn
  ansible.builtin.copy:
    src: "{{ openvpn_easyrsa_dest }}/EasyRSA-{{ openvpn_easyrsa_version }}/\
           ta.key"
    dest: "/etc/openvpn"
    remote_src: true
    mode: '0644'
  when: openvpn_ta_enabled
