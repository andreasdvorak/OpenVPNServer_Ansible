---
- name: Check if server.conf exists
  ansible.builtin.stat:
    path: "/etc/openvpn/server.conf"
  register: openvpn_server_conf_file

- name: Copy server.conf to /etc/openvpn
  ansible.builtin.copy:
    src: "/usr/share/doc/openvpn/examples/sample-config-files/server.conf"
    dest: "/etc/openvpn/server.conf"
    remote_src: true
    mode: '0644'
  when:
    - not openvpn_server_conf_file.stat.exists

- name: Update OpenVPN server.conf
  ansible.builtin.lineinfile:
    path: "/etc/openvpn/server.conf"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop: "{{ openvpn_server_conf_lines }}"
  notify: Restart OpenVPN
